<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src blob:; object-src 'none'"><title>我的房间</title><style>

</style></head><body><header><h1>我的房间</h1><p>空间放宽 20% · 床保持 1.5 × 2 米<br>单指旋转 · 双指缩放／移动 · 点家具看位置</p></header><main id="stage" aria-label="可旋转的房间三维布局"><canvas id="scene" aria-label="卧室布局"></canvas><div id="status" role="status">正在搭起小屋…</div></main><footer><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:8px"><label style="min-height:44px;display:flex;align-items:center;gap:6px"><input id="wardrobe-visible" type="checkbox">衣柜</label><label style="min-height:44px;display:flex;align-items:center;gap:6px"><input id="shelf-visible" type="checkbox" checked>铁架</label><label style="min-height:44px;display:flex;align-items:center"><input id="tree-shadow" type="checkbox" checked>树影</label><label for="sun-time">日照</label><input id="sun-time" type="range" min="8" max="19" step="0.25" value="14" aria-label="手动日照时间" style="flex:1;min-width:90px;min-height:44px"><output id="sun-label">14:00</output></div><div style="display:flex;align-items:center;gap:12px;margin-bottom:8px"><button id="curtain-toggle">合上窗帘</button><label for="curtain-range" style="font-size:13px">窗帘</label><input id="curtain-range" aria-label="窗帘打开程度" type="range" min="0" max="100" value="80" style="min-width:0;flex:1;min-height:44px"></div><nav aria-label="视角控制"><button id="perspective">立体</button><button id="top">俯视</button><button id="walls" aria-pressed="true">墙面</button><button id="labels" aria-pressed="true">标签</button><button id="zoom-in" aria-label="放大">＋</button><button id="zoom-out" aria-label="缩小">－</button><button id="retry" hidden>重新加载</button></nav><div id="selection" role="status">床头在左，书桌贴着床的上侧，窗户在书桌后面。</div><p>布局参照你的草图；手动日照为艺术模拟，不对应真实城市太阳位置</p><p id="interaction-diagnostic" style="font-size:11px;opacity:.7" aria-live="off">交互诊断：脚本尚未就绪</p></footer><script src="room.js"></script></body></html>
