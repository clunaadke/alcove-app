<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'; object-src 'none'"><title>我的房间</title><style>
:root{font:16px -apple-system,BlinkMacSystemFont,sans-serif;color:#312b2d;background:#eee9e2;color-scheme:light dark}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{display:flex;flex-direction:column}header{padding:16px 20px 4px}h1{font-size:20px;font-weight:600;margin:0 0 6px}p{font-size:13px;line-height:1.5;margin:0;color:#655b59}#stage{flex:1;min-height:120px;position:relative;touch-action:none}canvas{display:block;width:100%;height:100%}#status{position:absolute;top:40%;left:20px;right:20px;text-align:center;white-space:pre-wrap}footer{padding:8px 16px 20px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}button{font:inherit;font-size:14px;min-height:44px;min-width:44px;padding:8px 13px;color:inherit;background:#ffffffb8;border:1px solid #b6aaa0;border-radius:12px}button:focus-visible{outline:3px solid #886644;outline-offset:2px}button[aria-pressed=true]{background:#dac8b1}#selection{min-height:42px;font-size:14px;line-height:1.5}#retry{margin-top:12px}@media(prefers-color-scheme:dark){:root{background:#211e23;color:#eee7e0}p{color:#c2b6b3}button{background:#393239;border-color:#746770}button[aria-pressed=true]{background:#675444}}
</style></head><body><header><h1>我的房间</h1><p>床 1.5 × 2 米，其余尺寸暂估<br>单指旋转 · 双指缩放／移动 · 点家具看位置</p></header><main id="stage" aria-label="可旋转的房间三维布局"><canvas id="scene" aria-label="卧室布局"></canvas><div id="status" role="status">正在搭起小屋…</div></main><footer><div style="display:flex;align-items:center;gap:12px;margin-bottom:8px"><button id="curtain-toggle">合上窗帘</button><label for="curtain-range" style="font-size:13px">窗帘</label><input id="curtain-range" aria-label="窗帘打开程度" type="range" min="0" max="100" value="80" style="min-width:0;flex:1;min-height:44px"></div><nav aria-label="视角控制"><button id="perspective">立体</button><button id="top">俯视</button><button id="walls" aria-pressed="true">墙面</button><button id="labels" aria-pressed="true">标签</button><button id="zoom-in" aria-label="放大">＋</button><button id="zoom-out" aria-label="缩小">－</button><button id="retry" hidden>重新加载</button></nav><div id="selection" role="status">床头在左，书桌贴着床的上侧，窗户在书桌后面。</div><p>布局参照你的草图；家具按照片细化 · 床品与窗帘为自选配色</p></footer><script src="room.js"></script></body></html>
