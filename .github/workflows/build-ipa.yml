name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main, swiftui-native-chat]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Inject location token
        env:
          ALCOVE_LOC_TOKEN: ${{ secrets.ALCOVE_LOC_TOKEN }}
        run: |
          plutil -replace AlcoveLocToken -string "${ALCOVE_LOC_TOKEN}" ios/App/App/Info.plist

      - name: Install CocoaPods
        working-directory: ios/App
        run: pod install

      - name: Build unsigned .app
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath output/Alcove.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Strip signatures from frameworks
        working-directory: ios/App
        run: |
          find output/Alcove.xcarchive/Products/Applications/App.app/Frameworks -name '*.framework' -exec sh -c 'codesign --remove-signature "$1/$(basename "$1" .framework)" 2>/dev/null || true' _ {} \;
          codesign --remove-signature output/Alcove.xcarchive/Products/Applications/App.app/App 2>/dev/null || true

      - name: Package unsigned IPA
        working-directory: ios/App
        run: |
          mkdir -p output/Payload
          cp -r output/Alcove.xcarchive/Products/Applications/App.app output/Payload/
          cd output
          zip -r Alcove-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alcove-unsigned-ipa
          path: ios/App/output/Alcove-unsigned.ipa
          retention-days: 30
