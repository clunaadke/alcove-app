<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Alcove</title>
  <link rel="stylesheet" href="splash.css">
  <script src="quotes.js" defer></script>
  <script src="splash.js" defer></script>
</head>
<body>
  <div id="alcove-living-water">
    <div class="alw-screen">
      <img class="alw-photo" src="mist.webp" alt="清透蓝色的雾玻璃，边缘有少量水滴">
      <canvas class="alw-canvas" aria-label="在雾玻璃上滑动，擦开短句并拨动水面"></canvas>
      <div class="alw-intro"><div class="alw-en">LET THE WORLD WAIT.</div><div class="alw-cn">外面的世界，晚一点再说。</div></div>
      <button class="alw-enter" type="button" aria-label="进入 Alcove">ENTER</button>
      <span class="alw-access" aria-live="polite"></span>
    </div>
  </div>

</html>
